name: Build DGrien Android (Google Play & APK)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'dgrien-app/**'
      - '.github/workflows/dgrien-android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: |
        npm install
        cd dgrien-app
        npm install

    - name: Build DGrien Web Application
      run: |
        cd dgrien-app
        npm run build

    - name: Sync Capacitor Android
      run: |
        cd dgrien-app
        npx cap sync android

    - name: Generate Release Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -alias dgrienapp -keyalg RSA -keysize 2048 -validity 10000 -storepass dgrienapp123 -keypass dgrienapp123 -dname "CN=DGrien Driver App, OU=Fleet Operations, O=DGrien, L=Frankfurt, ST=Hesse, C=DE"

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Android Release AAB (Google Play Store)
      run: |
        cd dgrien-app/android
        chmod +x gradlew
        ./gradlew bundleRelease -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore -Pandroid.injected.signing.store.password=dgrienapp123 -Pandroid.injected.signing.key.alias=dgrienapp -Pandroid.injected.signing.key.password=dgrienapp123

    - name: Build Android Release APK (Direct Install)
      run: |
        cd dgrien-app/android
        ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore -Pandroid.injected.signing.store.password=dgrienapp123 -Pandroid.injected.signing.key.alias=dgrienapp -Pandroid.injected.signing.key.password=dgrienapp123

    - name: Upload Release AAB (Google Play Console)
      uses: actions/upload-artifact@v4
      with:
        name: dgrien-release-aab
        path: dgrien-app/android/app/build/outputs/bundle/release/app-release.aab

    - name: Upload Release APK (For Direct Smartphone Testing)
      uses: actions/upload-artifact@v4
      with:
        name: dgrien-release-apk
        path: dgrien-app/android/app/build/outputs/apk/release/app-release.apk

    - name: Upload Keystore (Keep this safe!)
      uses: actions/upload-artifact@v4
      with:
        name: dgrien-keystore
        path: release.keystore
