name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Select Xcode
      run: |
        if [ -d "/Applications/Xcode_15.4.app" ]; then
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
        elif [ -d "/Applications/Xcode_16.0.app" ]; then
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
        fi
        xcodebuild -version

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          client/package-lock.json

    - name: Install Root Dependencies
      run: npm install

    - name: Install Client Dependencies
      run: |
        cd client
        npm install

    - name: Build Web Application
      env:
        VITE_WS_URL: https://green1-wpng.onrender.com
        VITE_STRIPE_PUBLIC_KEY: pk_test_51TdyJNB2h3oHJV8dj9S071k3lzq8DEkDRTA54Geeq579R8EZl0Vz4lNfeIRWXWktqND4NKxeCEPob0GmkyEtrvqb003rDki96c
      run: npm run build --prefix client

    - name: Sync Capacitor
      run: npx cap sync ios

    - name: Set dynamic build version
      run: |
        BUILD_VER=$((100 + ${{ github.run_number }}))
        echo "Updating iOS build version in project.pbxproj to $BUILD_VER and marketing version to 1.3"
        sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $BUILD_VER/g" ios/App/App.xcodeproj/project.pbxproj
        sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = 1.3;/g" ios/App/App.xcodeproj/project.pbxproj

    - name: Install Apple Certificate and Provisioning Profile
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      run: |
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        KEYCHAIN_PASS="actions123"

        echo -n "$BUILD_CERTIFICATE_BASE64" | tr -d '\r' | tr -d '\n' | tr -d ' ' | base64 --decode -o $CERTIFICATE_PATH
        echo -n "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r' | tr -d '\n' | tr -d ' ' | base64 --decode -o $PP_PATH

        security create-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN_PATH

        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security list-keychains -d user -s $KEYCHAIN_PATH ~/Library/Keychains/login.keychain-db
        security default-keychain -s $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" $KEYCHAIN_PATH

        mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
        security cms -D -i $PP_PATH > $RUNNER_TEMP/profile.plist
        UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" $RUNNER_TEMP/profile.plist)
        PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" $RUNNER_TEMP/profile.plist 2>/dev/null || echo "Green Nightlife App Store")
        cp $PP_PATH "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
        echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV

    - name: Resolve Swift Package Dependencies
      run: |
        xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

    - name: Create Export Options Plist
      run: |
        cat <<EOF > $RUNNER_TEMP/ExportOptions.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
                <key>com.green-nightlife.app</key>
                <string>${{ env.PROFILE_NAME }}</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>NH892VUQXX</string>
        </dict>
        </plist>
        EOF

    - name: Build and Archive iOS App
      run: |
        xcodebuild -project ios/App/App.xcodeproj \
                   -scheme App \
                   -sdk iphoneos \
                   -configuration Release \
                   -archivePath $RUNNER_TEMP/App.xcarchive \
                   CODE_SIGN_STYLE=Manual \
                   DEVELOPMENT_TEAM=NH892VUQXX \
                   PROVISIONING_PROFILE_SPECIFIER="${{ env.PROFILE_NAME }}" \
                   CODE_SIGN_IDENTITY="Apple Distribution" \
                   archive

    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
                   -archivePath $RUNNER_TEMP/App.xcarchive \
                   -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
                   -exportPath $RUNNER_TEMP/build

    - name: Upload to TestFlight
      uses: apple-actions/upload-testflight-build@v1
      with:
        app-path: ${{ runner.temp }}/build/App.ipa
        issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}


